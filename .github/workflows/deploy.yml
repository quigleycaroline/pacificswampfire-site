name: Build site

# Every change to main (adding, editing or deleting photos) rebuilds the site
# and publishes the result to the `site` branch, which Cloudflare Pages serves.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # Encoded images are cached by file content: only new or changed photos are processed.
      - uses: actions/cache@v4
        with:
          path: .cache
          key: img-${{ hashFiles('photos/**') }}
          restore-keys: img-
      - run: python build.py
      - name: Publish to the site branch
        run: |
          cd dist
          git init -q -b site
          git add -A
          git -c user.name="site-builder" -c user.email="actions@users.noreply.github.com" commit -qm "Build ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" site
